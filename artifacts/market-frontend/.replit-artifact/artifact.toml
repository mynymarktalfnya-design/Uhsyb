kind = "web"
previewPath = "/"
title = "ميني ماركت الفنية"
version = "1.0.0"
id = "artifacts/market-frontend"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21902

[services.development]
run = "pnpm --filter @workspace/market-frontend run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/market-frontend", "run", "build" ]
publicDir = "artifacts/market-frontend/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21902"
BASE_PATH = "/"
